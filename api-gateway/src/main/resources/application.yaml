spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**,/api/categories/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/MICROSERVICE
          jwk-set-uri: http://localhost:8080/realms/MICROSERVICE/protocol/openid-connect/certs
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 6008

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG

